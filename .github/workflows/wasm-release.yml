name: WASM build
on:
  workflow_call:
    inputs:
      ripes-repo:
        description: 'Repository to build (owner/name). Defaults to the current repo.'
        type: string
        required: false
        default: ''
      ripes-ref:
        description: 'Git ref to build. Defaults to the current ref.'
        type: string
        required: false
        default: ''

jobs:
  buildUbuntu:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        build-type: [Release]

    steps:

    - name: Job info
      run: |
        echo "GitHub Ref: ${{ github.ref }}"
        echo "Event: ${{ github.event }}"

    - name: get container ready for build
      run: |
        sudo apt-get update
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -q --no-install-recommends \
        cmake git ca-certificates build-essential

    - name: checkout sources
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.ripes-repo || github.repository }}
        ref: ${{ inputs.ripes-ref || github.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-wasm-${{ matrix.build-type }}

    - name: Install Qt (Host)
      uses: jurplel/install-qt-action@v4
      with:
        py7zrversion: '>=0.20.2'
        version: '6.9.3'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: 'true'
        cache-key-prefix: 'install-qt-host-6.9.3'
        modules: 'qtcharts'

    - name: Install Qt (Emscripten)
      uses: jurplel/install-qt-action@v4
      with:
        py7zrversion: '>=0.20.2'
        version: '6.9.3'
        host: 'all_os'
        target: 'wasm'
        arch: 'wasm_multithread'
        modules: 'qtcharts'
        cache: 'true'
        cache-key-prefix: 'install-qt-emscripten-6.9.3'

    - name: Cache Emscripten SDK
      id: cache-emsdk
      uses: actions/cache@v4
      with:
        path: emsdk
        key: emsdk-3.1.70

    - name: install Emscripten
      if: steps.cache-emsdk.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/emscripten-core/emsdk.git
        cd emsdk
        ./emsdk install 3.1.70
        ./emsdk activate 3.1.70

    - name: build Ripes
      run: |
        source emsdk/emsdk_env.sh
        export QT_HOST_PATH=$(pwd)/../Qt/6.9.3/gcc_64/
        # The Qt for WebAssembly toolchain file selects the Emscripten compilers
        # and sets CMAKE_SYSTEM_NAME=Emscripten, so no manual CC/CXX environment
        # or compiler forcing is required.
        cmake                                           \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}   \
          -DRIPES_WITH_QPROCESS=OFF                     \
          -DQT_HOST_PATH="${QT_HOST_PATH}"              \
          -DCMAKE_TOOLCHAIN_FILE=$(pwd)/../Qt/6.9.3/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake \
          -DCMAKE_PREFIX_PATH=$(pwd)/../Qt/6.9.3/wasm_multithread/ \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache            \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache          \
          .
        cmake --build . --parallel

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.build-type }}_wasm
        path: |
          Ripes.wasm
          Ripes.js
          Ripes.worker.js
          qtloader.js
