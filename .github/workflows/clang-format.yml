
name: Check code format

on: [push, pull_request]

env:
  # Pinned via PyPI so that the version is independent of the runner image.
  # Format locally with: pip install clang-format==<version>
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  build:
    name: Check with clang-format
    runs-on: ubuntu-latest
    steps:
    - name: Get Ripes
      uses: actions/checkout@v4
    - name: Install clang-format
      run: |
        pipx install clang-format==${CLANG_FORMAT_VERSION}
        clang-format --version
    - name: clang-format
      run: |
        # Run clang-format on all tracked C/C++ files (see .clang-format-ignore for exclusions)
        git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format -i
        git diff > clang-format.patch
        if [ -s clang-format.patch ]; then
          echo "Clang-format found formatting problems in the following files. See diff in the clang-format.patch artifact."
          git diff --name-only 
          exit 1
        fi
        echo "Clang-format found no formatting problems"
        exit 0
    - name: Upload clang-format patch
      uses: actions/upload-artifact@v4
      if: ${{ failure() }}
      # Unfortunately, artifact uploads are always zips :(
      with:
        name: clang-format-patch
        path: clang-format.patch
    - name: clang-format patch display
      if: ${{ failure() }}
      run: |
        # Display patch
        cat clang-format.patch
